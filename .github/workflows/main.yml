name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: etido-tdd-recap
  ECS_SERVICE: etido-tdd-recap-363b
  ECS_CLUSTER: etido-tdd-cluster-v2
  EXECUTION_ROLE_ARN: arn:aws:iam::261219435789:role/ecsTaskExecutionRole
  INFRASTRUCTURE_ROLE_ARN: arn:aws:iam::261219435789:role/ecsInfrastructureRoleForExpressServices 

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install browser
        run: playwright install chromium

      - name: Test code
        run: pytest

      - name: Configure AWS credentials
        id: oidc_auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::261219435789:role/EtidoTddRecapRole
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run Bootstrap
        run: |
          chmod +x ./src/scripts/bootstrap.sh
          ./src/scripts/bootstrap.sh

      - name: Fallback Recovery Bootstrap
        if: failure() && steps.oidc_auth.outcome == 'failure'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "=== 1. CHECKING ENVIRONMENT VARIABLES ==="
          echo "AWS_ACCESS_KEY_ID is set to a string of length: ${#AWS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY is set to a string of length: ${#AWS_SECRET_ACCESS_KEY}"
          echo "Lingering AWS_SESSION_TOKEN? [ -n "$AWS_SESSION_TOKEN" ] && echo "Yes (Length: ${#AWS_SESSION_TOKEN})" || echo "No""
          echo "Lingering AWS_ROLE_ARN? [ -n "$AWS_ROLE_ARN" ] && echo "Yes" || echo "No""
          
          echo "=== 2. AWS CLI CREDENTIAL ORIGIN LOOKUP ==="
          aws configure list || echo "Could not run aws configure list"

          echo "=== 3. VERBOSE API CALL WITH DEBUG LOGS ==="
          aws sts get-caller-identity --debug

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init and Apply
        id: tf
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve
          echo "SUBNET_A=$(terraform output -raw subnet_a_id)" >> $GITHUB_ENV
          echo "SUBNET_B=$(terraform output -raw subnet_b_id)" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to Amazon ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          execution-role-arn: ${{ env.EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ env.INFRASTRUCTURE_ROLE_ARN }}
          subnets: ${{ env.SUBNET_A }},${{ env.SUBNET_B}}