name: Deploy
run-name: Deploy

on:
    push:
        branches:
            - main
    
    workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
    deploy-container-app:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install requirements
              run: pip install -r requirements.txt

            - name: Setup Playwright
              run: npx playwright install chromium

            - name: Test code
              run: pytest

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: eu-west-2
                role-to-assume: arn:aws:iam::261219435789:role/EtidoTddRecapRole

            - name: Authenticate docker client
              run: |
                aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 261219435789.dkr.ecr.eu-west-2.amazonaws.com

            - name: Build and push docker image
              run: |
                docker build --platform linux/amd64 --push --tag 261219435789.dkr.ecr.eu-west-2.amazonaws.com/etido-tdd-recap:latest .